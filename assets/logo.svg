<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 柔和内发光 -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 学士帽顶面渐变 -->
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- 学士帽底部暗面 -->
    <linearGradient id="capBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- 金色流苏渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 星辰 AI 发光 -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FDE047" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 图标底板：带柔和圆角的 App Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" ry="54" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- 顶部微光边框 -->
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" ry="53.25" fill="none" stroke="url(#innerGlow)" stroke-width="1.5" />

  <!-- 背景微弱星轨/光晕装饰 -->
  <circle cx="190" cy="65" r="45" fill="#FFFFFF" fill-opacity="0.08" filter="blur(16px)" />
  <circle cx="65" cy="190" r="35" fill="#38BDF8" fill-opacity="0.12" filter="blur(14px)" />

  <!-- 主体图形容器 -->
  <g transform="translate(0, 10)">
    <!-- 1. 文书底层衬托（微曲公文页/合格红头报告纸基底，代表规范 Word 申报书） -->
    <path d="M 66 172 C 90 184, 166 184, 190 172 C 182 186, 150 196, 128 196 C 106 196, 74 186, 66 172 Z"
          fill="#312E81" fill-opacity="0.35" />
    
    <!-- 2. 学士帽下半部（帽圈 Skullcap） -->
    <path d="M 94 136 Q 128 162 162 136 L 162 154 C 162 170, 94 170, 94 154 Z"
          fill="url(#capBase)" />
    
    <!-- 3. 学士帽菱形顶板（Mortarboard Rhombus） -->
    <path d="M 128 86 L 204 122 L 128 152 L 52 122 Z"
          fill="url(#capTop)" />

    <!-- 顶板侧边立体厚度折线 -->
    <path d="M 52 122 L 128 152 L 204 122 L 204 125 L 128 156 L 52 125 Z"
          fill="#94A3B8" />

    <!-- 4. 学士帽中心纽扣 -->
    <circle cx="128" cy="119" r="6" fill="#E2E8F0" />
    <circle cx="128" cy="119" r="4.5" fill="url(#goldGrad)" />

    <!-- 5. 金色流苏（流动感曲率 + 穗子） -->
    <path d="M 128 119 Q 106 122 84 142 Q 78 150 78 162"
          fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 75 162 L 81 162 L 82 175 C 82 178, 74 178, 74 175 Z"
          fill="url(#goldGrad)" />

    <!-- 6. 标志性 AI 四角星辰（右上角，代表 Stardust & AI Skills 智能） -->
    <g transform="translate(182, 70)" filter="url(#starGlow)">
      <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z"
            fill="url(#starGrad)" />
      <!-- 星辰核心高光点 -->
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- 7. 左侧陪伴微星（小星芒） -->
    <g transform="translate(68, 92) scale(0.48)" opacity="0.9">
      <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z"
            fill="#FDE047" />
    </g>
  </g>
</svg>