[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stardust-ops"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2", "httpx==0.28.1", "keyring==25.7.0"]

[project.scripts]
stardust-ops = "stardust_ops.cli:main"

[tool.setuptools]
packages = ["stardust_ops"]
