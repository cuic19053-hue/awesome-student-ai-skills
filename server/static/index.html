<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101012">
  <title>Stardust · 大学生申报材料 Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23171719'/%3E%3Cpath d='M16 6l2.3 7.7L26 16l-7.7 2.3L16 26l-2.3-7.7L6 16l7.7-2.3z' fill='%23ffffff'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("stardust_theme_v1") || "null");
        var mode = (saved && saved.mode) || "auto";
        var dark = mode === "dark" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app" class="app-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="/static/js/core.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/settings.js"></script>
  <script src="/static/js/project.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
