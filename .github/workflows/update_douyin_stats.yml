name: Sync Douyin Stats

on:
  schedule:
    # 每天北京时间 10:00 与 22:00（即 UTC 02:00 与 14:00）定时同步
    - cron: '0 2,14 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击运行

permissions:
  contents: write

jobs:
  sync-stats:
    name: 抓取抖音最新点赞与收藏数据
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装 Playwright 与 Chromium 依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: 执行同步脚本
        run: |
          python scripts/sync_douyin_stats.py --auto

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有文档或统计文件的修改
          if [[ -n $(git status --porcelain README.md README_EN.md assets/douyin_stats.json) ]]; then
            echo "检测到数据更新，正在提交..."
            git add README.md README_EN.md assets/douyin_stats.json
            git commit -m "chore(stats): 自动同步抖音最新点赞与收藏指标 [skip ci]"
            git push origin main
          else
            echo "数据未变动，无需提交。"
          fi
