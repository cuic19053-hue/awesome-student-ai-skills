name: Production Uptime

on:
  schedule:
    # 避开整点拥塞，约每五分钟一次；GitHub 调度可能延迟，不保证实例常驻。
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 检查生产存活并进行轻量预热
        run: python3 scripts/check_site_health.py
      - name: 后台核对模型用量并报告逾期异常
        env:
          BILLING_RECONCILIATION_TOKEN: ${{ secrets.BILLING_RECONCILIATION_TOKEN }}
        run: python3 scripts/run_billing_reconciliation.py
