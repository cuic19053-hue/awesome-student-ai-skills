name: CI

on:
  push:
  pull_request:

jobs:
  docs-and-tests:
    name: 文档一致性 + 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r utils/requirements.txt -r server/requirements.txt
          pip install pytest

      - name: 文档一致性门禁（35 个赛道 / README 声称量 / 索引数量）
        run: python scripts/check_doc_consistency.py

      - name: 运行测试
        run: python -m pytest tests -q
