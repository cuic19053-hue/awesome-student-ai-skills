name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-tests:
    name: 文档一致性 + 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装中文字体（figgen 配图渲染依赖，v2.2 配图规范）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-droid-fallback fonts-noto-cjk
          # 注意：fonts-noto-cjk 为 .ttc 集合，matplotlib 不支持；
          # fonts-droid-fallback 提供单文件 ttf（Droid Sans Fallback）供 figgen 使用

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r utils/requirements.txt
          if [ -f server/requirements.txt ]; then
            pip install -r server/requirements.txt
          else
            echo "server/ 尚未纳入版本控制，跳过服务层依赖（相关测试会自动 skip）"
          fi
          pip install pytest

      - name: 文档一致性门禁（35 个赛道 / README 声称量 / 索引数量）
        run: python scripts/check_doc_consistency.py

      - name: 运行测试
        run: python -m pytest tests -q -rs
