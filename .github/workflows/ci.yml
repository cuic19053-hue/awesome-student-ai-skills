name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  material-worker-container:
    name: Material Worker 容器运行时冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 构建 Worker 镜像
        run: docker build --platform linux/amd64 -t stardust-material-worker:ci -f infra/material-worker/Dockerfile .

      - name: 验证离线模块导入、中文字体和 SVG 渲染
        run: |
          docker run --rm --platform linux/amd64 \
            --network none --cpus 1 --memory 2g --memory-swap 2g --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --workdir /tmp \
            stardust-material-worker:ci python -c '
          from pathlib import Path
          import shutil
          from proposal.material_export import check_pages
          from proposal.material_figures import FigureSpec, font_path, render_svg
          from proposal.material_worker_proxy import MaterialWorkerBridge
          from utils.layout_audit import audit
          assert Path(font_path()).is_file()
          assert MaterialWorkerBridge
          assert shutil.which("chromium")
          assert shutil.which("libreoffice") or shutil.which("soffice")
          output = Path("/tmp/worker-smoke")
          output.mkdir()
          image = render_svg(FigureSpec(
              id="smoke", section_id="abstract", title="离线容器冒烟测试",
              renderer="svg", nodes=["虚构输入", "虚构输出"]), output)
          assert image.is_file() and image.stat().st_size > 0
          print("worker container imports and SVG rendering passed")
          '

  docs-and-tests:
    name: 文档一致性 + 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装中文字体（figgen 配图渲染依赖，v2.2 配图规范）
        timeout-minutes: 5
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends fonts-droid-fallback
          # 仅安装 Droid Sans Fallback：它提供 matplotlib 可用的单文件 TTF；
          # fonts-noto-cjk 是 .ttc 集合，matplotlib 不支持且无需额外下载。

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r utils/requirements.txt
          if [ -f server/requirements.txt ]; then
            pip install -r server/requirements.txt
          else
            echo "server/ 尚未纳入版本控制，跳过服务层依赖（相关测试会自动 skip）"
          fi
          pip install pytest

      - name: 文档一致性门禁（35 个赛道 / README 声称量 / 索引数量）
        run: python scripts/check_doc_consistency.py

      - name: 排版硬指标门禁（references/layout_standard.md，18 条静态条款）
        run: python utils/layout_audit.py examples/demos

      - name: 运行测试
        run: python -m pytest tests -q -rs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 前端导出鉴权、状态轮询与上传代理回归
        run: node --test tests/js/*.test.js infra/storage-worker/worker.test.mjs

      - name: 隔离 PostgreSQL 存储配置、CAS、RLS 与计费回归
        if: matrix.python-version == '3.12'
        timeout-minutes: 5
        run: |
          docker pull postgres:15-alpine
          RUN_POSTGRES_POLICY_TESTS=1 python -m pytest \
            tests/test_material_postgres.py \
            tests/test_observability_postgres.py \
            tests/test_trial_policy_postgres.py \
            tests/test_workbench_reconciliation_postgres.py \
            tests/test_user_model_config.py -q
