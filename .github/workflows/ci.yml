name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-tests:
    name: 文档一致性 + 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装中文字体（figgen 配图渲染依赖，v2.2 配图规范）
        timeout-minutes: 5
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends fonts-droid-fallback
          # 仅安装 Droid Sans Fallback：它提供 matplotlib 可用的单文件 TTF；
          # fonts-noto-cjk 是 .ttc 集合，matplotlib 不支持且无需额外下载。

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r utils/requirements.txt
          if [ -f server/requirements.txt ]; then
            pip install -r server/requirements.txt
          else
            echo "server/ 尚未纳入版本控制，跳过服务层依赖（相关测试会自动 skip）"
          fi
          pip install pytest

      - name: 文档一致性门禁（35 个赛道 / README 声称量 / 索引数量）
        run: python scripts/check_doc_consistency.py

      - name: 运行测试
        run: python -m pytest tests -q -rs
